name: Weekly report

# Monday morning: the owner's weekly report (usage, guest votes, what we recommended, accuracy).
on:
  schedule:
    - cron: '40 4 * * 1' # late fallback; the on-time Monday 07:40 Athens run is dispatched by Supabase pg_cron (idempotent)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # the on-time run is dispatched by Supabase; the late GitHub cron must not email the report twice
      - name: Skip the late fallback when this week's report exists
        id: guard
        if: github.event_name == 'schedule'
        run: |
          made=$(jq -r '.generatedAt // empty' public/data/weekly.json 2>/dev/null || true)
          if [ -n "$made" ] && [ $(( $(date +%s) - $(date -d "$made" +%s) )) -lt 432000 ]; then
            echo "weekly report made at $made; skipping the fallback run"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.guard.outputs.skip != 'true'
      - run: npm run weekly
        if: steps.guard.outputs.skip != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          RECEPTION_EMAIL: ${{ secrets.RECEPTION_EMAIL }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          VITE_DASHBOARD_URL: ${{ vars.VITE_DASHBOARD_URL || 'https://firmusagency.github.io/weather-mood/' }}
      - name: Commit report
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "weather-mood-bot"
          git config user.email "weather-mood-bot@users.noreply.github.com"
          git add public/data/weekly.json data/reports
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "data: weekly report $(date -u +%Y-%m-%d)"
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

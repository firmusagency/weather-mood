name: Feedback export

# Every morning after the forecast verification: pull guest/reception votes and visit counts,
# join them with the forecast we had issued, publish aggregates + calibration for the dashboard.
on:
  schedule:
    - cron: '5 3 * * *' # 06:05 Athens (summer) / 05:05 (winter)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run feedback:export
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      - name: Commit feedback data
        run: |
          git config user.name "weather-mood-bot"
          git config user.email "weather-mood-bot@users.noreply.github.com"
          git add data/feedback public/data/feedback.json public/data/calibration.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "data: guest feedback export $(date -u +%Y-%m-%d)"
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

name: Evening message

# ~18:40 Athens: fresh forecast, then tomorrow's plan and the ready-to-send messages for every
# guest profile in 4 languages. Emails the reception a digest when SMTP secrets are set.
on:
  schedule:
    - cron: '40 15 * * *' # late fallback only; the on-time 17:40 Athens run is dispatched by Supabase pg_cron
  workflow_dispatch:
    inputs:
      only_if_missing:
        description: 'Second-chance run from the scheduler: do nothing when the output already exists'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: snapshot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evening:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # GitHub runs this cron hours late (seen: 8 h, i.e. 01:50 Athens the next day); the on-time run
      # comes from the Supabase scheduler (supabase/migrations/0003_scheduler.sql). The fallback may
      # only run when no evening message was made in the last 20 hours AND it is still evening in
      # Athens. Judging by "tomorrow's file" is wrong after midnight: tomorrow has moved on by then.
      - name: Skip the late fallback unless an evening message is really missing
        id: guard
        if: github.event_name == 'schedule' || inputs.only_if_missing == 'true'
        run: |
          hour=$(TZ=Europe/Athens date +%-H)
          made=$(jq -r '.generatedAt // empty' public/data/evening.json 2>/dev/null || true)
          age=999999
          if [ -n "$made" ]; then age=$(( $(date +%s) - $(date -d "$made" +%s) )); fi
          if [ "$age" -lt 72000 ]; then
            echo "an evening message was made ${age}s ago; skipping the fallback run"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "$hour" -lt 15 ] || [ "$hour" -gt 21 ]; then
            echo "it is ${hour}:00 in Athens, not evening; skipping the fallback run"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.guard.outputs.skip != 'true'
      # A fresh forecast when the provider answers (the script retries); when it does not, the
      # message is still built from the last snapshot in the repository, which is a few hours old.
      - name: Fresh forecast (the last snapshot is used if this fails)
        run: npm run snapshot:fetch
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true
        env:
          OPEN_METEO_API_KEY: ${{ secrets.OPEN_METEO_API_KEY }}
      # the park's own open/closed notice; a failure here must not stop the message
      - run: npm run samaria:status
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true
      - run: npm run evening
        if: steps.guard.outputs.skip != 'true'
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          RECEPTION_EMAIL: ${{ secrets.RECEPTION_EMAIL }}
          VITE_GUEST_URL: ${{ vars.VITE_GUEST_URL || 'https://firmusagency.github.io/weather-mood/guest.html' }}
          VITE_RECEPTION_WHATSAPP: ${{ vars.VITE_RECEPTION_WHATSAPP }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
      - name: Commit
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "weather-mood-bot"
          git config user.email "weather-mood-bot@users.noreply.github.com"
          git add public/data data/archive data/messages data/closures
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "data: evening message $(date -u +%Y-%m-%d)"
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

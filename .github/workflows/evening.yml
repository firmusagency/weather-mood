name: Evening message

# ~18:40 Athens: fresh forecast, then tomorrow's plan and the ready-to-send messages for every
# guest profile in 4 languages. Emails the reception a digest when SMTP secrets are set.
on:
  schedule:
    - cron: '40 15 * * *' # late fallback only; the on-time 17:40 Athens run is dispatched by Supabase pg_cron
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evening:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # GitHub runs this cron 3–5 h late; the on-time run comes from the Supabase scheduler
      # (supabase/migrations/0003_scheduler.sql). When that run already wrote tomorrow's message,
      # the late fallback must not regenerate it and push/email the guests a second time.
      - name: Skip the late fallback when tomorrow's message exists
        id: guard
        if: github.event_name == 'schedule'
        run: |
          tomorrow=$(TZ=Europe/Athens date -d tomorrow +%F)
          if [ -f "data/messages/$tomorrow.json" ]; then
            echo "evening message for $tomorrow already exists; skipping the fallback run"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.guard.outputs.skip != 'true'
      - run: npm run snapshot:fetch
        if: steps.guard.outputs.skip != 'true'
        env:
          OPEN_METEO_API_KEY: ${{ secrets.OPEN_METEO_API_KEY }}
      # the park's own open/closed notice; a failure here must not stop the message
      - run: npm run samaria:status
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true
      - run: npm run evening
        if: steps.guard.outputs.skip != 'true'
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          RECEPTION_EMAIL: ${{ secrets.RECEPTION_EMAIL }}
          VITE_GUEST_URL: ${{ vars.VITE_GUEST_URL || 'https://firmusagency.github.io/weather-mood/guest.html' }}
          VITE_RECEPTION_WHATSAPP: ${{ vars.VITE_RECEPTION_WHATSAPP }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
      - name: Commit
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "weather-mood-bot"
          git config user.email "weather-mood-bot@users.noreply.github.com"
          git add public/data data/archive data/messages data/closures
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "data: evening message $(date -u +%Y-%m-%d)"
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

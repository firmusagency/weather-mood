name: Deploy site

# Publishes the dashboard, guest page and accuracy page to GitHub Pages
# (https://firmusagency.github.io/weather-mood/). Runs on code changes and after every data
# workflow, so the live pages always carry the latest forecast, messages and verification.
on:
  push:
    paths:
      - 'src/**'
      - 'public/**'
      - '*.html'
      - 'vite.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.env'
      - '.github/workflows/pages.yml'
  workflow_run:
    workflows: ['Weather snapshot', 'Evening message', 'Morning plan-B check', 'Plan-B notification', 'Feedback export', 'Forecast verification', 'Spot photos', 'Weekly report']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The page must subscribe browsers with the public half of the key the evening script signs with.
      # It is derived from the secret here (only the public key leaves this step), so there is one
      # setting to maintain; without a usable secret the page keeps the key committed in .env.
      - name: Public push key from the private one
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          key=$(npx tsx scripts/vapid-public.ts || true)
          if [ -n "$key" ]; then
            echo "VITE_VAPID_PUBLIC_KEY=$key" >> "$GITHUB_ENV"
            echo "push public key derived from the secret (${#key} characters)"
          else
            echo "no usable VAPID_PRIVATE_KEY secret: the page keeps the key in .env"
          fi
      - run: npm run build
        env:
          VITE_BASE: /weather-mood/
          VITE_GUEST_URL: ${{ vars.VITE_GUEST_URL || 'https://firmusagency.github.io/weather-mood/guest.html' }}
          VITE_DASHBOARD_URL: ${{ vars.VITE_DASHBOARD_URL || 'https://firmusagency.github.io/weather-mood/' }}
          VITE_RECEPTION_WHATSAPP: ${{ vars.VITE_RECEPTION_WHATSAPP }}
          VITE_PROPERTY_ID: ${{ vars.VITE_PROPERTY_ID }}
          # shown in the guests' privacy note; without them it points to the reception
          VITE_PRIVACY_OPERATOR: ${{ vars.VITE_PRIVACY_OPERATOR }}
          VITE_PRIVACY_CONTACT: ${{ vars.VITE_PRIVACY_CONTACT }}
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: Weather snapshot

# Free "backend": refreshes the forecast data the demo uses and archives one
# next-day forecast per day for later accuracy checks.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fetch-snapshot.ts'
      - 'src/data/**'
      - 'src/engine/openmeteo.ts'
      - '.github/workflows/snapshot.yml'

permissions:
  contents: write

concurrency:
  group: snapshot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run snapshot:fetch
        env:
          OPEN_METEO_API_KEY: ${{ secrets.OPEN_METEO_API_KEY }}
      - name: Commit snapshot
        run: |
          git config user.name "weather-mood-bot"
          git config user.email "weather-mood-bot@users.noreply.github.com"
          git add public/data data/archive
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "data: weather snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

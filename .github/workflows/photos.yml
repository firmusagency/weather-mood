name: Spot photos

# On demand: pick one freely licensed Wikimedia Commons photo per spot (with credit), store a
# 1200 px copy under public/photos and the attribution in src/data/photos.json.
on:
  workflow_dispatch:
    inputs:
      spots:
        description: 'Spot ids to (re)pick, space separated. Empty = only spots without a photo. "--all" = every unlocked spot.'
        required: false

permissions:
  contents: write

concurrency:
  group: snapshot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run photos -- ${{ inputs.spots }}
      - name: Commit photos
        run: |
          git config user.name "weather-mood-bot"
          git config user.email "weather-mood-bot@users.noreply.github.com"
          git add public/photos src/data/photos.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "data: spot photos from Wikimedia Commons"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

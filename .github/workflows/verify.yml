name: Forecast verification

# Every morning: compare yesterday's forecast (archived the day before) with what the
# Chania airport station actually measured, and update the rolling accuracy summary.
on:
  schedule:
    - cron: '35 2 * * *' # 05:35 Athens (summer) / 04:35 (winter)
  workflow_dispatch:
    inputs:
      date:
        description: 'Day to verify (YYYY-MM-DD, Europe/Athens). Default: yesterday.'
        required: false

permissions:
  contents: write

concurrency:
  group: snapshot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify -- ${{ inputs.date }}
      - name: Commit verification
        run: |
          git config user.name "weather-mood-bot"
          git config user.email "weather-mood-bot@users.noreply.github.com"
          git add data/verification public/data/verification.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "data: forecast verification $(date -u +%Y-%m-%d)"
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

name: Morning plan-B check

# ~05:50 Athens, after the 05:17 snapshot: compare today's fresh forecast with the evening message
# we sent yesterday. If the picture moved, write the plan-B note (and email the reception).
on:
  schedule:
    - cron: '50 2 * * *' # late fallback only; the on-time 05:50 Athens run is dispatched by Supabase pg_cron
  workflow_dispatch:
    inputs:
      only_if_missing:
        description: 'Second-chance run from the scheduler: do nothing when the output already exists'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: snapshot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Same as the evening workflow: the on-time 05:50 run is dispatched by Supabase; the GitHub
      # cron arrives hours later and must not overwrite today's plan-B verdict or re-send it.
      - name: Skip the late fallback when today's check exists
        id: guard
        if: github.event_name == 'schedule' || inputs.only_if_missing == 'true'
        run: |
          today=$(TZ=Europe/Athens date +%F)
          hour=$(TZ=Europe/Athens date +%-H)
          if [ "$(jq -r .date public/data/plan-b.json 2>/dev/null)" = "$today" ]; then
            echo "plan-B check for $today already done; skipping the fallback run"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "$hour" -lt 4 ] || [ "$hour" -ge 12 ]; then
            echo "it is ${hour}:00 in Athens, too late for a morning note; skipping the fallback run"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.guard.outputs.skip != 'true'
      # A fresh forecast when the provider answers (the script retries); when it does not, the
      # message is still built from the last snapshot in the repository, which is a few hours old.
      - name: Fresh forecast (the last snapshot is used if this fails)
        run: npm run snapshot:fetch
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true
        env:
          OPEN_METEO_API_KEY: ${{ secrets.OPEN_METEO_API_KEY }}
      # the park's own open/closed notice; a failure here must not stop the message
      - run: npm run samaria:status
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true
      - run: npm run morning-check
        if: steps.guard.outputs.skip != 'true'
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          RECEPTION_EMAIL: ${{ secrets.RECEPTION_EMAIL }}
          VITE_GUEST_URL: ${{ vars.VITE_GUEST_URL || 'https://firmusagency.github.io/weather-mood/guest.html' }}
          VITE_RECEPTION_WHATSAPP: ${{ vars.VITE_RECEPTION_WHATSAPP }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
      - name: Commit
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "weather-mood-bot"
          git config user.email "weather-mood-bot@users.noreply.github.com"
          git add data/plan-b-log.jsonl public/data data/archive data/closures
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "data: morning plan-B check $(date -u +%Y-%m-%d)"
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
